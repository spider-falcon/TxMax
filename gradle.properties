# =========================================================
# PROJECT-WIDE GRADLE SETTINGS
# Optimized for Kotlin + Android + Compose projects
# =========================================================

# =========================================================
# JVM / MEMORY OPTIMIZATION
# =========================================================

# Increase Gradle heap memory
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:+UseStringDeduplication

# Keep Gradle daemon alive for faster builds
org.gradle.daemon=true

# Enable parallel module builds
org.gradle.parallel=true

# Configure projects only when needed
org.gradle.configureondemand=true

# Enable Gradle build cache
org.gradle.caching=true

# Enable configuration cache
org.gradle.configuration-cache=true

# Watch file system changes
org.gradle.vfs.watch=true

# =========================================================
# KOTLIN SETTINGS
# =========================================================

# Kotlin official style
kotlin.code.style=official

# Faster incremental Kotlin compilation
kotlin.incremental=true

# Enable Kotlin classpath snapshotting
kotlin.incremental.useClasspathSnapshot=true

# Enable Kotlin build cache
kotlin.caching.enabled=true

# Faster Kotlin compiler execution
kotlin.compiler.execution.strategy=in-process

# =========================================================
# ANDROID OPTIMIZATION
# =========================================================

# Use AndroidX libraries
android.useAndroidX=true

# Generate smaller R classes
android.nonTransitiveRClass=true

# Faster resource processing
android.nonFinalResIds=true

# REMOVED: android.defaults.buildfeatures.buildconfig=true
# (Deprecated and causes build failure in AGP 9.0+)

# Use new resource shrinker
android.enableNewResourceShrinker=true

# =========================================================
# COMPOSE OPTIMIZATION
# =========================================================

# Compose compiler stability
android.enableComposeCompilerMetrics=false
android.enableComposeCompilerReports=false

# =========================================================
# DEX / BUILD SPEED
# =========================================================

# Faster dexing
android.enableDexingArtifactTransform=true

# Enable R8 full mode
android.enableR8.fullMode=true

# =========================================================
# STABILITY
# =========================================================

# Better dependency handling
org.gradle.warning.mode=summary

# Disable unnecessary welcome message
org.gradle.welcome=never

# =========================================================
# OPTIONAL DEBUGGING
# Uncomment only if needed
# =========================================================

# org.gradle.logging.level=info
# org.gradle.debug=false
# android.debug.obsoleteApi=true